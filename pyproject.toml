[project]
name = "nice-shot"
version = "1.1.2"
description = "Interactive tokamak shot dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=4.1.0",
    "duckdb<1.3",
    "matplotlib>=3.10.9",
    "numpy<2",
    "pandas<2.3",
    "plotly>=6.7.0",
    "pyarrow<23.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "gunicorn>=21.2.0",
    "scikit-learn<1.7.0",
    "umap-learn>=0.5.12",
    "xarray>=2026.4.0",
    "uda-xarray>=0.2.3",
]

[project.scripts]
nice-shot = "nice_shot.app:main"

[project.optional-dependencies]
shap = [
    "shap>=0.49.1",
]
fairmast = [
    "zarr>=3.0",
    "fsspec>=2024.10.0",
    "s3fs>=2024.10.0",
    "h5netcdf>=1.3.0",
    "h5py>=3.11.0",
]

[dependency-groups]
dev = [
    "bump-my-version>=0.32.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a14",
    "zensical>=0.0.43",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["nice_shot*"]

[tool.bumpversion]
current_version = "1.0.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["nice_shot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
